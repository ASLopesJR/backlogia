{% extends "_base_auth.html" %}

{% block title %}Setup - Backlogia{% endblock %}

{% block auth_content %}
    <div class="auth-card">
        <div class="auth-header">
            <img src="/static/favicons/Backlogia_logo.png" alt="Backlogia logo" class="auth-logo">
            <h1>Create Account</h1>
            <p>Set up the owner account for this Backlogia instance. This will be the only account.</p>
        </div>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/auth/setup">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username" autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
                <div class="hint">Must be at least 8 characters</div>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn-submit">Create Account</button>
        </form>
    </div>
{% endblock %}
