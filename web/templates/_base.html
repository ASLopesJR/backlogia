<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Backlogia{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicons/apple-touch-icon.png">
    <link rel="manifest" href="/static/favicons/site.webmanifest">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    {% block head_extra %}{% endblock %}
</head>
<body>
{% block nav %}
    {% set path = request.url.path %}
    <nav class="top-nav">
        <a href="/" class="nav-brand">
            <img src="/static/favicons/Backlogia_logo.png" alt="Backlogia logo">Backlogia
        </a>
        <div class="nav-links">
            <a href="/" class="nav-link {% if path == '/' %}active{% endif %}">Discover</a>
            <a href="/library" class="nav-link {% if path == '/library' %}active{% endif %}">Library</a>
            <a href="/collections" class="nav-link {% if path.startswith('/collection') %}active{% endif %}">Collections</a>
            <a href="/random" class="nav-link random">Random</a>
            <a href="/settings" class="nav-link {% if path.startswith('/settings') %}active{% endif %}">Settings</a>
        </div>
        <button class="nav-hamburger" aria-label="Toggle navigation" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
    </nav>
    <script>
        (function() {
            var nav = document.querySelector('.top-nav');
            var btn = document.querySelector('.nav-hamburger');
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                var open = nav.classList.toggle('nav-open');
                btn.setAttribute('aria-expanded', open ? 'true' : 'false');
            });
            document.addEventListener('click', function(e) {
                if (!nav.contains(e.target)) {
                    nav.classList.remove('nav-open');
                    btn.setAttribute('aria-expanded', 'false');
                }
            });
        })();
    </script>
{% endblock %}

{% block content %}{% endblock %}

{% include '_footer.html' %}
</body>
</html>
